  </g>
  <g transform="matrix(1 0 0 -1 0 800)" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round">
    <path d="M 130 470 C 196 520 258 600 292 650 C 304 666 328 668 330 636 C 334 520 334 380 322 250 C 312 160 314 100 310 58"/>
    <path d="M 176 52 C 240 72 360 38 446 60"/>
    <circle cx="124" cy="466" r="66" fill="#000"/>
