    <line x1="-100" y1="970" x2="700" y2="970"/>
    <line x1="-100" y1="800" x2="700" y2="800"/>
    <line x1="-100" y1="280" x2="700" y2="280"/>
    <line x1="-100" y1="100" x2="700" y2="100"/>
    <line x1="-100" y1="60" x2="700" y2="60"/>
  </g>
  <g transform="matrix(1 0 0 -1 0 800)" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round">
    <path d="M 60 474 C 60 250 90 40 170 40 C 240 40 280 150 290 330 C 300 150 340 40 410 40 C 490 40 520 250 520 474"/>
  </g>
</svg>
