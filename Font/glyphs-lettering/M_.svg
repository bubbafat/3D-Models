    <line x1="-100" y1="60" x2="700" y2="60"/>
  </g>
  <g transform="matrix(1 0 0 -1 0 800)" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round">
    <path d="M 70 46 C 74 300 80 520 96 630 C 102 666 132 666 142 632 C 182 520 226 400 250 340 C 274 400 318 520 358 632 C 368 666 398 666 404 630 C 420 520 426 300 430 46"/>
